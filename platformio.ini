; PlatformIO Project Configuration File for BonbridgeESP32
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Partitionierung mit ausreichend Platz für App und NVS
board_build.partitions = default_8MB.csv

build_flags = 
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -O2

lib_deps =
    ; Arduino-ESP32 bringt ETH, WiFi, WebServer, Preferences und SPI standardmäßig mit
